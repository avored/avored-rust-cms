[package]
name = "avored-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
console_log = { version = "1", optional = true }
chrono = { version = "0.4.42", features = ["serde"] }
gloo-net = "0.7"
gloo-storage = "0.4.0"
leptos = { version = "0.8.22" }
leptos_meta = { version = "0.8.7" }
leptos_router = { version = "0.8.17" }
log = "0.4"
rust-i18n = "4.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.130", optional = true }

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:console_log",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[lints]
workspace = true
