[package]
name = "avored-api"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "avored-api"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0", optional = true }
async-trait = { version = "0.1", optional = true }
avored-core = { path = "../avored-core", default-features = false }
avored-web = { path = "../avored-web", default-features = false }
axum = { version = "0.8.0", optional = true, features = ["macros", "multipart"] }
chrono = { version = "0.4.42", features = ["serde"] }
dotenvy = { version = "0.15.7", optional = true }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"], optional = true }
leptos = { version = "0.8.22" }
leptos_axum = { version = "0.8.10", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"], optional = true }
rust-i18n = "4.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.1", optional = true }
surrealdb = { version = "3.3.5", features = ["kv-rocksdb", "kv-mem"], optional = true }
surrealdb-core = { version = "3.3.5", optional = true }
surrealdb-rpc = { version = "3.3.5", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net"], optional = true }
tower = { version = "0.5.2", optional = true }
tower-http = { version = "0.7.0", features = ["fs", "cors", "trace"], optional = true }
tracing = { version = "0.1.41", optional = true }
tracing-appender = { version = "0.2.3", optional = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"], optional = true }
uuid = { version = "1.29.0", features = ["v4", "fast-rng"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.2", features = ["util"] }

[features]
default = ["ssr"]
ssr = [
    "avored-core/ssr",
    "avored-web/ssr",
    "dep:anyhow",
    "dep:async-trait",
    "dep:axum",
    "dep:dotenvy",
    "dep:leptos_axum",
    "dep:jsonwebtoken",
    "dep:reqwest",
    "dep:sha2",
    "dep:surrealdb",
    "dep:surrealdb-core",
    "dep:surrealdb-rpc",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-appender",
    "dep:tracing-subscriber",
    "dep:uuid",
]

[lints]
workspace = true
