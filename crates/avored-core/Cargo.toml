[package]
name = "avored-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { version = "1.0", optional = true }
argon2 = { version = "0.6", optional = true }
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8.0", optional = true }
base64 = { version = "0.23.1", optional = true }
chrono = { version = "0.4.42", features = ["serde"] }
dotenvy = { version = "0.15.7", optional = true }
email_address = { version = "0.2.9", optional = true }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"], optional = true }
leptos = { version = "0.8.22", optional = true }
rand = { version = "0.10.3", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"], optional = true }
rust-i18n = "4.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.1", optional = true }
surrealdb = { version = "3.3.5", features = ["kv-rocksdb", "kv-mem"] }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
tracing = { version = "0.1.41", optional = true }
uuid = { version = "1.29.0", features = ["v4", "fast-rng"], optional = true }

[features]
default = ["ssr"]
ssr = [
    "dep:anyhow",
    "dep:argon2",
    "dep:async-trait",
    "dep:axum",
    "dep:base64",
    "dep:email_address",
    "dep:dotenvy",
    "dep:jsonwebtoken",
    "dep:leptos",
    "dep:rand",
    "dep:reqwest",
    "dep:sha2",
    "dep:tokio",
    "dep:tracing",
    "dep:uuid",
]

[lints]
workspace = true
